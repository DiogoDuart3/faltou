version: 2
updates:
  # Imagem base do PHP fixada por digest: quando a imagem é republicada
  # (p. ex. correção de segurança do PHP ou do sistema base), o Dependabot
  # abre um PR com o digest novo e o workflow dependabot-automerge faz merge.
  # Saltos de versão (8.4 -> 8.5) ficam de fora e fazem-se à mão.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
